<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS Implementation Evaluation</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom font fallback if Inter isn't loaded */
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const IconDatabase = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg>;
    const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
    const IconMapPin = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 absolute left-3 top-3 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>;
    const IconBriefcase = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 absolute left-3 top-3 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>;
    const IconClock = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className || "w-5 h-5 text-blue-600"} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
    const IconBarChart3 = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"></path><rect width="4" height="7" x="7" y="10" rx="1"></rect><rect width="4" height="12" x="15" y="5" rx="1"></rect></svg>;
    const IconCheckCircle2 = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 text-green-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>;
    const IconList = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" x2="21" y1="6" y2="6"></line><line x1="8" x2="21" y1="12" y2="12"></line><line x1="8" x2="21" y1="18" y2="18"></line><line x1="3" x2="3.01" y1="6" y2="6"></line><line x1="3" x2="3.01" y1="12" y2="12"></line><line x1="3" x2="3.01" y1="18" y2="18"></line></svg>;
    const IconTrendingUp = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>;
    const IconWallet = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 text-yellow-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>;
    const IconArrowRight = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
    const IconArrowDown = () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>;

    function App() {
      const [activeTab, setActiveTab] = useState('form');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitStatus, setSubmitStatus] = useState(null);

      // Link Backend Google Apps Script
      const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzxbQQZRER1XM075XqpkaPd_jaIoMuzeZf_ivQVZDY5Hkv-usqOtBvef6zIQZU0SIOf/exec';

      const initialForm = {
        nama: '', nik: '', jabatan: '', site: '',
        receiptIM: '', receiptWM: '',
        issueIM: '', issueWM: '',
        opnameIM: '', opnameWM: '',
        transferOrderWM: '', inboundDeliveryIM: '', inboundDeliveryWM: '',
        preference: '', opinion: ''
      };

      const [formData, setFormData] = useState(initialForm);
      const [submissions, setSubmissions] = useState([]);
      const [isLoadingData, setIsLoadingData] = useState(false);
      const [fetchError, setFetchError] = useState(null);

      // Data Volume Transaksi
      const transactionData = [
        { site: 'TDM', y2025: 2394, y2026: 4555 },
        { site: 'CMSJ', y2025: 2966, y2026: 4148 },
        { site: 'CPLR', y2025: 3253, y2026: 6894 },
        { site: 'PKM', y2025: 134, y2026: 80 },
        { site: 'CCLG', y2025: 1210, y2026: 2233 },
        { site: 'CDI', y2025: 7846, y2026: 8647 },
        { site: 'MHU', y2025: 14160, y2026: 27101 },
        { site: 'DCPLR', y2025: 0, y2026: 1202 },
      ];
      const total2025 = transactionData.reduce((sum, item) => sum + item.y2025, 0);
      const total2026 = transactionData.reduce((sum, item) => sum + item.y2026, 0);

      // Fungsi untuk menarik data dari Google Sheets secara Real-time (GET)
      const fetchData = async () => {
        setIsLoadingData(true);
        setFetchError(null);
        try {
          const response = await fetch(SCRIPT_URL);
          const result = await response.json();
          if (result.status === 'success') {
            setSubmissions(result.data);
          }
        } catch (error) {
          console.error("Error fetching data:", error);
          setFetchError("Gagal mengambil data dari server.");
        } finally {
          setIsLoadingData(false);
        }
      };

      // Tarik data secara otomatis saat aplikasi pertama kali dimuat
      useEffect(() => {
        fetchData();
      }, []);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        setSubmitStatus(null);

        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });

          setSubmitStatus('success');
          setSubmissions([{...formData, 
            receiptIM: Number(formData.receiptIM), receiptWM: Number(formData.receiptWM),
            issueIM: Number(formData.issueIM), issueWM: Number(formData.issueWM),
            opnameIM: Number(formData.opnameIM), opnameWM: Number(formData.opnameWM),
            transferOrderWM: Number(formData.transferOrderWM), inboundDeliveryIM: Number(formData.inboundDeliveryIM), inboundDeliveryWM: Number(formData.inboundDeliveryWM)
          }, ...submissions]);
          setFormData(initialForm);

          setTimeout(() => { setSubmitStatus(null); }, 3000);
        } catch (error) {
          console.error("Error submitting:", error);
          setSubmitStatus('error');
        } finally {
          setIsSubmitting(false);
        }
      };

      const calculateAverage = (field) => {
        if (submissions.length === 0) return 0;
        const sum = submissions.reduce((acc, curr) => acc + Number(curr[field]), 0);
        return (sum / submissions.length).toFixed(1);
      };

      const prefWMCount = submissions.filter(s => s.preference === 'Warehouse Management (WM)').length;
      const prefPercentage = submissions.length === 0 ? 0 : Math.round((prefWMCount / submissions.length) * 100);

      // Kalkulasi Finansial & ROI untuk Top Management
      const capex = 600000000;
      const manpower2025 = 49;
      const manpower2026 = 46;
      const currentManpower = manpower2026; // Acuan perhitungan cost saving saat ini
      const salary = 9000000;
      const itemsPerDay = 130;
      const workMins = 660; // 11 jam kerja efektif (Shift 12 jam - 1 jam istirahat)
      const complexityFactor = 1.1;

      let timeSaved = 0, efficiency = 0, savingMonth = 0, savingYear = 0, bep = 0;
      let dtRecIM = 0, dtRecWM = 0, dtIssIM = 0, dtIssWM = 0, dtOpnIM = 0, dtOpnWM = 0, dtTOWM = 0, dtInbIM = 0, dtInbWM = 0;

      if (submissions.length > 0) {
        dtRecIM = Number(calculateAverage('receiptIM'));
        dtRecWM = Number(calculateAverage('receiptWM'));
        
        dtIssIM = Number(calculateAverage('issueIM'));
        dtIssWM = Number(calculateAverage('issueWM'));
        
        dtOpnIM = Number(calculateAverage('opnameIM'));
        dtOpnWM = Number(calculateAverage('opnameWM'));
        
        dtTOWM = Number(calculateAverage('transferOrderWM')); // IM = 0
        
        dtInbIM = Number(calculateAverage('inboundDeliveryIM'));
        dtInbWM = Number(calculateAverage('inboundDeliveryWM'));

        // Kalkulasi penghematan riil per proses berdasarkan kuisioner
        const savedRec = dtRecIM - dtRecWM;
        const savedIss = dtIssIM - dtIssWM;
        const savedOpn = dtOpnIM - dtOpnWM;
        const savedTO = 0 - dtTOWM; // WMS menambah proses TO
        const savedInb = dtInbIM - dtInbWM;

        // Rata-rata penghematan lead time (karena proporsi 130 transaksi tidak diketahui/merata)
        timeSaved = (savedRec + savedIss + savedOpn + savedTO + savedInb) / 5;

        // Kalkulasi efisiensi dan finansial secara detail
        const savedPerDay = timeSaved * itemsPerDay * complexityFactor;
        efficiency = savedPerDay / workMins; 
        if(efficiency > 1) efficiency = 1; // Limit max 100%
        if(efficiency < 0) efficiency = 0;

        savingMonth = efficiency * salary * currentManpower;
        savingYear = savingMonth * 12;
        bep = savingMonth > 0 ? (capex / savingMonth) : 0;
      }

      const formatRp = (num) => "Rp " + Math.round(num).toLocaleString('id-ID');

      return (
        <div className="min-h-screen">
          {/* Header */}
          <header className="bg-blue-800 text-white p-6 shadow-md">
            <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
              <div>
                <h1 className="text-2xl font-bold flex items-center gap-2">
                  <IconDatabase />
                  WMS Implementation Evaluation
                </h1>
                <p className="text-blue-200 text-sm mt-1">System Development Dept. Logistik</p>
              </div>
              <div className="flex gap-2 bg-blue-900 p-1 rounded-lg w-full md:w-auto">
                <button 
                  onClick={() => setActiveTab('form')}
                  className={`flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-semibold transition-all ${activeTab === 'form' ? 'bg-white text-blue-800 shadow' : 'text-blue-100 hover:bg-blue-800'}`}
                >
                  Isi Kuisioner
                </button>
                <button 
                  onClick={() => { setActiveTab('dashboard'); fetchData(); }}
                  className={`flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-semibold transition-all ${activeTab === 'dashboard' ? 'bg-white text-blue-800 shadow' : 'text-blue-100 hover:bg-blue-800'}`}
                >
                  Dashboard Report
                </button>
              </div>
            </div>
          </header>

          {}
          <main className="max-w-5xl mx-auto p-4 md:p-6 mt-4 mb-12">
            
            {/* Status Messages */}
            {submitStatus === 'success' && (
              <div className="mb-6 p-4 bg-green-100 border border-green-300 text-green-800 rounded-lg flex items-center gap-3">
                <IconCheckCircle2 />
                <div>
                  <p className="font-bold">Berhasil!</p>
                  <p className="text-sm">Data kuisioner Anda telah berhasil dikirim dan disimpan ke Google Sheets.</p>
                </div>
              </div>
            )}

            {submitStatus === 'error' && (
              <div className="mb-6 p-4 bg-red-100 border border-red-300 text-red-800 rounded-lg">
                <p className="font-bold">Gagal Menyimpan Data</p>
                <p className="text-sm">Terjadi kesalahan pada jaringan. Silakan coba lagi.</p>
              </div>
            )}

            {}
            {activeTab === 'form' ? (
              <form onSubmit={handleSubmit} className="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                <div className="mb-8">
                  <h2 className="text-xl font-bold border-b pb-2 mb-4 flex items-center gap-2">
                    <IconUser /> Data Identitas Karyawan
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                      <label className="block text-sm font-semibold mb-1">Nama Lengkap <span className="text-red-500">*</span></label>
                      <input required type="text" name="nama" value={formData.nama} onChange={handleChange} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan nama..." />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold mb-1">NIK <span className="text-red-500">*</span></label>
                      <input required type="text" name="nik" value={formData.nik} onChange={handleChange} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan NIK..." />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold mb-1">Jabatan <span className="text-red-500">*</span></label>
                      <div className="relative">
                        <IconBriefcase />
                        <input required type="text" name="jabatan" value={formData.jabatan} onChange={handleChange} className="w-full p-2 pl-9 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cth: Storeman" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-semibold mb-1">Site / Lokasi <span className="text-red-500">*</span></label>
                      <div className="relative">
                        <IconMapPin />
                        <input required type="text" name="site" value={formData.site} onChange={handleChange} className="w-full p-2 pl-9 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cth: DC Jakarta" />
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mb-8">
                  <h2 className="text-xl font-bold border-b pb-2 mb-4 flex items-center gap-2">
                    <IconClock /> Evaluasi Waktu Proses (Estimasi Menit / Material)
                  </h2>
                  
                  <div className="space-y-6">
                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                      <p className="font-semibold mb-3">1. Berapa rata-rata waktu yang Anda butuhkan untuk menyelesaikan proses <span className="text-blue-700">Receipt (Penerimaan)</span>?</p>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">Inventory Management (IM): <span className="text-red-500">*</span></label>
                          <input required type="number" min="0" name="receiptIM" value={formData.receiptIM} onChange={handleChange} className="w-full p-2 border rounded" placeholder="... Menit" />
                        </div>
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">Warehouse Management (WM): <span className="text-red-500">*</span></label>
                          <input required type="number" min="0" name="receiptWM" value={formData.receiptWM} onChange={handleChange} className="w-full p-2 border rounded" placeholder="... Menit" />
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                      <p className="font-semibold mb-3">2. Berapa rata-rata waktu yang Anda butuhkan untuk menyelesaikan proses <span className="text-blue-700">Goods Issue (Pengeluaran)</span>?</p>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">Inventory Management (IM): <span className="text-red-500">*</span></label>
                          <input required type="number" min="0" name="issueIM" value={formData.issueIM} onChange={handleChange} className="w-full p-2 border rounded" placeholder="... Menit" />
                        </div>
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">Warehouse Management (WM): <span className="text-red-500">*</span></label>
                          <input required type="number" min="0" name="issueWM" value={formData.issueWM} onChange={handleChange} className="w-full p-2 border rounded" placeholder="... Menit" />
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                      <p className="font-semibold mb-3">3. Berapa rata-rata waktu yang Anda butuhkan untuk menyelesaikan proses <span className="text-blue-700">Stock Opname</span>?</p>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">Inventory Management (IM): <span className="text-red-500">*</span></label>
                          <input required type="number" min="0" name="opnameIM" value={formData.opnameIM} onChange={handleChange} className="w-full p-2 border rounded" placeholder="... Menit" />
                        </div>
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">Warehouse Management (WM): <span className="text-red-500">*</span></label>
                          <input required type="number" min="0" name="opnameWM" value={formData.opnameWM} onChange={handleChange} className="w-full p-2 border rounded" placeholder="... Menit" />
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                      <p className="font-semibold mb-3">4. Berapa rata-rata waktu yang Anda butuhkan untuk pembuatan <span className="text-blue-700">Transfer Order</span>?</p>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">Warehouse Management (WM):</label>
                          <input type="number" min="0" name="transferOrderWM" value={formData.transferOrderWM} onChange={handleChange} className="w-full p-2 border rounded" placeholder="... Menit" />
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                      <p className="font-semibold mb-3">5. Berapa rata-rata waktu yang Anda butuhkan untuk pembuatan <span className="text-blue-700">Inbound Delivery/DOM</span> (Khusus Depo)?</p>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">Inventory Management (IM):</label>
                          <input type="number" min="0" name="inboundDeliveryIM" value={formData.inboundDeliveryIM} onChange={handleChange} className="w-full p-2 border rounded" placeholder="... Menit" />
                        </div>
                        <div>
                          <label className="block text-sm text-slate-600 mb-1">Warehouse Management (WM):</label>
                          <input type="number" min="0" name="inboundDeliveryWM" value={formData.inboundDeliveryWM} onChange={handleChange} className="w-full p-2 border rounded" placeholder="... Menit" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mb-8">
                  <h2 className="text-xl font-bold border-b pb-2 mb-4 flex items-center gap-2">
                    <IconBarChart3 /> Preferensi & Opini
                  </h2>
                  
                  <div className="space-y-4">
                    <div>
                      <p className="font-semibold mb-2">6. Terhadap penggunaan Implementasi WMS, menurut Anda lebih produktif mana? <span className="text-red-500">*</span></p>
                      <div className="flex flex-col sm:flex-row gap-4">
                        <label className="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-slate-50">
                          <input required type="radio" name="preference" value="Inventory Management (IM)" onChange={handleChange} checked={formData.preference === 'Inventory Management (IM)'} />
                          SAP Modul Inventory Management (IM)
                        </label>
                        <label className="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-slate-50">
                          <input required type="radio" name="preference" value="Warehouse Management (WM)" onChange={handleChange} checked={formData.preference === 'Warehouse Management (WM)'} />
                          SAP Modul Warehouse Management (WM)
                        </label>
                      </div>
                    </div>
                    
                    <div>
                      <label className="font-semibold mb-2 block">Berikan Pendapat/Alasan Anda: <span className="text-red-500">*</span></label>
                      <textarea required name="opinion" value={formData.opinion} onChange={handleChange} rows="4" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Tuliskan pengalaman Anda secara detail..."></textarea>
                    </div>
                  </div>
                </div>

                <button 
                  type="submit" 
                  disabled={isSubmitting}
                  className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors flex justify-center items-center gap-2 disabled:opacity-70"
                >
                  {isSubmitting ? (
                    <>Loading...</>
                  ) : (
                    <>Submit Kuisioner</>
                  )}
                </button>
              </form>
            ) : (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 className="text-slate-500 text-sm font-bold mb-1 uppercase">Total Responden</h3>
                    <div className="flex items-baseline gap-3">
                      <p className="text-4xl font-black text-blue-800">{submissions.length}</p>
                      {isLoadingData && <span className="text-xs text-blue-600 bg-blue-100 px-2 py-1 rounded-full animate-pulse">Live Update...</span>}
                    </div>
                    {fetchError ? (
                      <p className="text-xs text-red-500 mt-2 font-semibold">{fetchError}</p>
                    ) : (
                      <p className="text-xs text-slate-400 mt-2">Karyawan telah berpartisipasi</p>
                    )}
                  </div>
                  <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 md:col-span-2">
                    <h3 className="text-slate-500 text-sm font-bold mb-3 uppercase">Tingkat Preferensi (Produktivitas)</h3>
                    {submissions.length === 0 ? (
                      <p className="text-sm text-slate-400 italic">Belum ada data evaluasi</p>
                    ) : (
                      <>
                        <div className="w-full bg-slate-200 rounded-full h-6 mb-2 flex overflow-hidden">
                          <div className="bg-green-500 h-6 flex items-center justify-center text-xs text-white font-bold transition-all duration-500" style={{ width: `${prefPercentage}%` }}>
                            {prefPercentage > 10 ? `${prefPercentage}% Pilih WM` : ''}
                          </div>
                          <div className="bg-slate-400 h-6 flex items-center justify-center text-xs text-white font-bold transition-all duration-500" style={{ width: `${100 - prefPercentage}%` }}>
                            {100 - prefPercentage > 10 ? `${100 - prefPercentage}% Pilih IM` : ''}
                          </div>
                        </div>
                        <div className="flex justify-between text-xs text-slate-500 font-semibold">
                          <span className="text-green-600">■ Warehouse Management (WMS)</span>
                          <span className="text-slate-500">■ Inventory Management (IM)</span>
                        </div>
                      </>
                    )}
                  </div>
                </div>

                {/* Top Management Financial ROI Report */}
                <div className="bg-gradient-to-br from-slate-900 to-blue-900 p-6 rounded-xl shadow-lg border border-blue-800 text-white">
                  <h3 className="text-lg font-bold mb-6 flex items-center gap-2 text-blue-100">
                    <IconTrendingUp /> Executive Summary: WMS Financial & ROI Analysis
                  </h3>
                  
                  {submissions.length === 0 ? (
                    <p className="text-sm text-blue-300 italic">Data survei belum tersedia untuk melakukan proyeksi finansial.</p>
                  ) : (
                    <div>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div className="bg-white/10 p-4 rounded-lg border border-white/20">
                          <p className="text-blue-200 text-xs font-semibold uppercase mb-1">Total Investasi (CAPEX)</p>
                          <p className="text-2xl font-black text-white">{formatRp(capex)}</p>
                        </div>
                        <div className="bg-white/10 p-4 rounded-lg border border-white/20">
                          <p className="text-blue-200 text-xs font-semibold uppercase mb-1">Cost Saving per Tahun</p>
                          <p className="text-2xl font-black text-green-400">{timeSaved > 0 ? formatRp(savingYear) : "Rp 0"}</p>
                        </div>
                        <div className="bg-white/10 p-4 rounded-lg border border-white/20">
                          <p className="text-blue-200 text-xs font-semibold uppercase mb-1">Estimasi Balik Modal (BEP)</p>
                          <p className="text-2xl font-black text-yellow-400">{timeSaved > 0 ? `${bep.toFixed(1)} Bulan` : "N/A"}</p>
                        </div>
                      </div>

                      <div className="bg-white/5 rounded-lg border border-white/20 mb-6 overflow-hidden">
                        <div className="bg-white/10 px-4 py-2 border-b border-white/20 font-bold text-sm text-white">
                          Rincian Kalkulasi Penghematan Lead Time (Berdasarkan Kuisioner)
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-sm text-left">
                            <thead className="bg-white/5 text-blue-200">
                              <tr>
                                <th className="px-4 py-2 border-b border-white/10">Proses Transaksi</th>
                                <th className="px-4 py-2 border-b border-white/10 text-center">IM (Menit)</th>
                                <th className="px-4 py-2 border-b border-white/10 text-center">WM (Menit)</th>
                                <th className="px-4 py-2 border-b border-white/10 text-right">Penghematan</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-white/10 text-blue-100">
                              <tr>
                                <td className="px-4 py-2">Receipt (Penerimaan)</td>
                                <td className="px-4 py-2 text-center">{dtRecIM.toFixed(1)}</td>
                                <td className="px-4 py-2 text-center">{dtRecWM.toFixed(1)}</td>
                                <td className={`px-4 py-2 text-right font-semibold ${(dtRecIM - dtRecWM) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{(dtRecIM - dtRecWM) > 0 ? '+' : ''}{(dtRecIM - dtRecWM).toFixed(1)} Min</td>
                              </tr>
                              <tr>
                                <td className="px-4 py-2">Goods Issue (Pengeluaran)</td>
                                <td className="px-4 py-2 text-center">{dtIssIM.toFixed(1)}</td>
                                <td className="px-4 py-2 text-center">{dtIssWM.toFixed(1)}</td>
                                <td className={`px-4 py-2 text-right font-semibold ${(dtIssIM - dtIssWM) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{(dtIssIM - dtIssWM) > 0 ? '+' : ''}{(dtIssIM - dtIssWM).toFixed(1)} Min</td>
                              </tr>
                              <tr>
                                <td className="px-4 py-2">Stock Opname</td>
                                <td className="px-4 py-2 text-center">{dtOpnIM.toFixed(1)}</td>
                                <td className="px-4 py-2 text-center">{dtOpnWM.toFixed(1)}</td>
                                <td className={`px-4 py-2 text-right font-semibold ${(dtOpnIM - dtOpnWM) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{(dtOpnIM - dtOpnWM) > 0 ? '+' : ''}{(dtOpnIM - dtOpnWM).toFixed(1)} Min</td>
                              </tr>
                              <tr>
                                <td className="px-4 py-2">Transfer Order</td>
                                <td className="px-4 py-2 text-center">-</td>
                                <td className="px-4 py-2 text-center">{dtTOWM.toFixed(1)}</td>
                                <td className="px-4 py-2 text-right font-semibold text-red-400">-{dtTOWM.toFixed(1)} Min</td>
                              </tr>
                              <tr>
                                <td className="px-4 py-2">Inbound Delivery</td>
                                <td className="px-4 py-2 text-center">{dtInbIM.toFixed(1)}</td>
                                <td className="px-4 py-2 text-center">{dtInbWM.toFixed(1)}</td>
                                <td className={`px-4 py-2 text-right font-semibold ${(dtInbIM - dtInbWM) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{(dtInbIM - dtInbWM) > 0 ? '+' : ''}{(dtInbIM - dtInbWM).toFixed(1)} Min</td>
                              </tr>
                              <tr className="bg-white/10 font-bold text-white">
                                <td colSpan="3" className="px-4 py-2 text-right">Rata-Rata Lead Time Hemat per Material:</td>
                                <td className="px-4 py-2 text-right text-green-400">{timeSaved > 0 ? '+' : ''}{timeSaved.toFixed(2)} Min</td>
                              </tr>
                            </tbody>
                          </table>
                        </div>
                      </div>

                      {/* Visualisasi Alur Logika Finansial */}
                      <div className="bg-black/20 p-5 rounded-lg border border-black/20">
                        <p className="font-bold text-white mb-4 text-center md:text-left">Alur Logika Finansial:</p>
                        
                        <div className="flex flex-col md:flex-row items-center justify-between gap-2 md:gap-4 mb-6">
                          {/* Step 1 */}
                          <div className="flex-1 w-full bg-white/5 border border-white/10 rounded-xl p-4 text-center relative overflow-hidden">
                            <div className="w-10 h-10 mx-auto bg-blue-500/20 rounded-full flex items-center justify-center mb-2">
                              <IconClock className="text-blue-300 w-5 h-5"/>
                            </div>
                            <p className="text-[10px] text-blue-200 font-bold uppercase mb-1 tracking-wider">1. Efisiensi Waktu</p>
                            <p className="text-xl font-black text-white mb-1">
                              {((timeSaved > 0 ? timeSaved : 0) * itemsPerDay * complexityFactor).toFixed(0)} <span className="text-xs font-normal text-blue-200">mnt/hari/org</span>
                            </p>
                            <p className="text-[10px] text-blue-300/70">({timeSaved > 0 ? timeSaved.toFixed(2) : 0} mnt × 130 trx × 1.1)</p>
                          </div>

                          {/* Arrow 1 */}
                          <div className="hidden md:block text-blue-500/50"><IconArrowRight /></div>
                          <div className="block md:hidden text-blue-500/50 my-1"><IconArrowDown /></div>

                          {/* Step 2 */}
                          <div className="flex-1 w-full bg-white/5 border border-white/10 rounded-xl p-4 text-center relative overflow-hidden">
                            <div className="w-10 h-10 mx-auto bg-green-500/20 rounded-full flex items-center justify-center mb-2">
                              <IconTrendingUp className="text-green-300 w-5 h-5"/>
                            </div>
                            <p className="text-[10px] text-green-200 font-bold uppercase mb-1 tracking-wider">2. Peningkatan Produktivitas</p>
                            <p className="text-xl font-black text-green-400 mb-1">
                              {(efficiency * 100).toFixed(1)}% <span className="text-xs font-normal text-green-200">Efisiensi</span>
                            </p>
                            <p className="text-[10px] text-blue-300/70">(Dari 660 mnt jam kerja efektif)</p>
                          </div>

                          {/* Arrow 2 */}
                          <div className="hidden md:block text-blue-500/50"><IconArrowRight /></div>
                          <div className="block md:hidden text-blue-500/50 my-1"><IconArrowDown /></div>

                          {/* Step 3 */}
                          <div className="flex-1 w-full bg-gradient-to-b from-yellow-500/20 to-yellow-600/5 border border-yellow-500/30 rounded-xl p-4 text-center relative overflow-hidden shadow-lg shadow-yellow-900/20">
                            <div className="w-10 h-10 mx-auto bg-yellow-500/20 rounded-full flex items-center justify-center mb-2">
                              <IconWallet />
                            </div>
                            <p className="text-[10px] text-yellow-200 font-bold uppercase mb-1 tracking-wider">3. Konversi Rupiah</p>
                            <p className="text-xl font-black text-yellow-400 mb-1">
                              {formatRp(savingMonth)}<span className="text-xs font-normal text-yellow-200">/Bln</span>
                            </p>
                            <p className="text-[10px] text-yellow-200/70">({(efficiency * 100).toFixed(1)}% × Rp 9Jt × {currentManpower} Org)</p>
                          </div>
                        </div>
                        
                        <div className={`p-4 rounded-lg border text-sm text-center font-medium ${timeSaved > 0 ? 'bg-green-500/10 border-green-500/30 text-green-100' : 'bg-yellow-500/10 border-yellow-500/30 text-yellow-200'}`}>
                          {timeSaved > 0 
                            ? `💡 Kesimpulan: Berdasarkan penghematan riil di atas, nilai investasi WMS sebesar Rp 600 Juta diproyeksikan akan mencapai titik impas (Break-Even Point) dalam kurun waktu ${bep.toFixed(1)} bulan.` 
                            : '⚠️ Saat ini data belum menunjukkan penghematan waktu (akumulasi lead time WM masih tercatat lebih lama dari IM).'}
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {/* Tabel Volume Transaksi */}
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                  <h3 className="text-lg font-bold mb-6 flex items-center gap-2">
                    <IconBarChart3 /> Peningkatan Volume Transaksi (April 2025 vs April 2026)
                  </h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm text-left border-collapse">
                      <thead className="bg-slate-50 text-slate-500 font-bold uppercase">
                        <tr>
                          <th className="px-4 py-3 border-b">Site</th>
                          <th className="px-4 py-3 border-b">April 2025 (IM / Sebelum)</th>
                          <th className="px-4 py-3 border-b">April 2026 (WM / Sesudah)</th>
                          <th className="px-4 py-3 border-b">Pertumbuhan</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {transactionData.map((row, idx) => {
                          const isNew = row.y2025 === 0;
                          const growth = isNew ? 100 : Math.round(((row.y2026 - row.y2025) / row.y2025) * 100);
                          const isPositive = row.y2026 > row.y2025;
                          return (
                            <tr key={idx} className="hover:bg-slate-50">
                              <td className="px-4 py-3 font-semibold">{row.site}</td>
                              <td className="px-4 py-3">{row.y2025.toLocaleString('id-ID')}</td>
                              <td className="px-4 py-3 font-bold text-blue-700">{row.y2026.toLocaleString('id-ID')}</td>
                              <td className="px-4 py-3">
                                {isNew ? (
                                  <span className="text-blue-600 font-bold text-xs bg-blue-100 px-2 py-1 rounded-full">Site Baru</span>
                                ) : (
                                  <span className={`font-bold text-xs px-2 py-1 rounded-full ${isPositive ? 'text-green-700 bg-green-100' : 'text-red-700 bg-red-100'}`}>
                                    {isPositive ? '+' : ''}{growth}%
                                  </span>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                      <tfoot className="bg-slate-100 font-bold">
                        <tr>
                          <td className="px-4 py-3 rounded-bl-lg">TOTAL KESELURUHAN</td>
                          <td className="px-4 py-3">{total2025.toLocaleString('id-ID')}</td>
                          <td className="px-4 py-3 text-blue-800">{total2026.toLocaleString('id-ID')}</td>
                          <td className="px-4 py-3 rounded-br-lg text-green-700">+{Math.round(((total2026 - total2025) / total2025) * 100)}%</td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                  <p className="text-xs text-slate-500 mt-4 italic">* Data ini diambil berdasarkan periode <strong>April 2025</strong> dan <strong>April 2026</strong> yang menunjukkan kapasitas penyelesaian transaksi oleh Manpower (Storeman) meningkat berkat efisiensi waktu operasional setelah implementasi WMS.</p>

                  {/* Highlight Produktivitas Manpower */}
                  <div className="mt-6 bg-blue-50 p-5 rounded-xl border border-blue-100 flex flex-col lg:flex-row gap-6 items-center justify-between">
                    <div className="flex-1">
                      <h4 className="text-blue-900 font-bold mb-2 flex items-center gap-2">
                        <IconUser /> Analisis Produktivitas Manpower
                      </h4>
                      <p className="text-sm text-blue-800 leading-relaxed">
                        Data membuktikan terjadinya lonjakan volume transaksi sebesar <strong>{Math.round(((total2026 - total2025) / total2025) * 100)}%</strong> pada April 2026. 
                        Luar biasanya, meskipun beban kerja meningkat drastis, perusahaan justru berhasil melakukan <strong>efisiensi Manpower dari {manpower2025} orang menjadi {manpower2026} orang</strong>. 
                        Hal ini mengonfirmasi bahwa implementasi WMS secara langsung telah mendongkrak kapasitas produktivitas setiap individu Storeman secara signifikan.
                      </p>
                    </div>
                    <div className="flex gap-3 w-full lg:w-auto">
                      <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 flex flex-col justify-center min-w-[120px] text-center">
                        <p className="text-xs text-slate-500 font-bold uppercase mb-1">IM (Apr 2025)</p>
                        <p className="text-2xl font-black text-slate-700">{Math.round(total2025 / manpower2025).toLocaleString('id-ID')}</p>
                        <p className="text-[10px] text-slate-500">{manpower2025} Orang</p>
                      </div>
                      <div className="bg-white p-4 rounded-lg shadow-sm border-2 border-blue-300 flex flex-col justify-center min-w-[120px] text-center">
                        <p className="text-xs text-blue-600 font-bold uppercase mb-1">WMS (Apr 2026)</p>
                        <p className="text-2xl font-black text-blue-700">{Math.round(total2026 / manpower2026).toLocaleString('id-ID')}</p>
                        <p className="text-[10px] text-blue-500">{manpower2026} Orang</p>
                      </div>
                      <div className="bg-green-500 p-4 rounded-lg shadow-sm flex flex-col justify-center min-w-[100px] text-center">
                        <p className="text-xs text-green-100 font-bold uppercase mb-1">Kapasitas</p>
                        <p className="text-2xl font-black text-white">+{Math.round(((total2026 / manpower2026) - (total2025 / manpower2025)) / (total2025 / manpower2025) * 100)}%</p>
                        <p className="text-[10px] text-green-100">Lebih Produktif</p>
                      </div>
                    </div>
                  </div>

                </div>

                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                  <h3 className="text-lg font-bold mb-6 flex items-center gap-2">
                    <IconList /> Rekapitulasi Pendapat & Alasan
                  </h3>
                  {submissions.length === 0 ? (
                    <p className="text-sm text-slate-400 italic">Belum ada opini yang tersimpan.</p>
                  ) : (
                    <div className="space-y-4">
                      {submissions.map((sub, idx) => (
                        <div key={idx} className="p-4 border border-slate-100 bg-slate-50 rounded-lg">
                          <div className="flex flex-wrap justify-between items-start mb-2 gap-2">
                            <div>
                              <span className="font-bold text-blue-900">{sub.nama}</span>
                              <span className="text-xs text-slate-500 ml-2">({sub.nik}) - {sub.jabatan} di {sub.site}</span>
                            </div>
                            <span className={`text-xs px-2 py-1 rounded-full font-bold ${sub.preference.includes('WM') ? 'bg-green-100 text-green-700' : 'bg-slate-200 text-slate-700'}`}>
                              Pilih {sub.preference.includes('WM') ? 'WM' : 'IM'}
                            </span>
                          </div>
                          <p className="text-sm text-slate-700 italic">"{sub.opinion}"</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
